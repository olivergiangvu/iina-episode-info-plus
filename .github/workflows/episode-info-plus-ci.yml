name: Episode Info Plus CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every active JS module
        run: |
          node --check main.js
          node --check episode-plus-identity.js
          node --check episode-plus-tvmaze.js
          node --check episode-plus-http.js
          node --check episode-plus-aios.js
          node --check epplus-now-playing.js
          node --check tests/now-playing-integration.test.js
          node --check tests/release-capabilities.test.js
          node --check scripts/verify-plugin-package.js
      - name: Existing identification, UI and integration regression suites
        run: |
          node tests/episode-plus-identity.test.js
          node tests/mystic-nine-autolookup.test.js
          node tests/upstream-134-integration.test.js
          node tests/upstream-135-integration.test.js
          node tests/upstream-135-ui-integration.test.js
          node tests/glass-parity.test.js
      - name: Permanent capability and native Now Playing regression gates
        run: |
          node tests/release-capabilities.test.js
          node tests/now-playing-integration.test.js
      - name: Build and verify the ACTUAL installable IINA package
        run: |
          node -e 'const a=require("./Info.json");if(!Number.isInteger(a.ghVersion)||a.ghRepo!=="olivergiangvu/iina-episode-info-plus"||a.identifier!=="io.github.olivergiangvu.iinaepisodeinfoplus")process.exit(1)'
          mkdir -p dist
          V="$(node -p 'require("./Info.json").version')"
          OUT="dist/Episode-Info-Plus-$V.iinaplgz"
          zip -q -r "$OUT" Info.json main.js episode-plus-identity.js episode-plus-tvmaze.js episode-plus-http.js episode-plus-aios.js epplus-now-playing.js sidebar.html overlay.html LICENSE
          unzip -tq "$OUT"
          node scripts/verify-plugin-package.js "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: episode-info-plus-ci-package
          path: dist/*.iinaplgz
          retention-days: 30
