name: Episode Info Plus CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every active JS module
        run: |
          node --check main.js
          node --check episode-plus-identity.js
          node --check episode-plus-tvmaze.js
          node --check episode-plus-http.js
          node --check episode-plus-aios.js
          node --check epplus-now-playing.js
          node --check trusted-series-aliases.js
          node --check tests/learned-episode-identity.test.js
          node --check tests/now-playing-integration.test.js
          node --check tests/release-capabilities.test.js
          node --check scripts/verify-plugin-package.js
      - name: Existing identification, UI and integration regression suites
        run: |
          node tests/episode-plus-identity.test.js
          node tests/mystic-nine-autolookup.test.js
          node tests/upstream-134-integration.test.js
          node tests/upstream-135-integration.test.js
          node tests/upstream-135-ui-integration.test.js
          node tests/glass-parity.test.js
          node tests/learned-episode-identity.test.js
      - name: Permanent capability and native Now Playing regression gates
        run: |
          node tests/release-capabilities.test.js
          node tests/now-playing-integration.test.js
      - name: Build and verify the ACTUAL installable IINA package
        run: |
          node -e 'const a=require("./Info.json");if(!Number.isInteger(a.ghVersion)||a.ghRepo!=="olivergiangvu/iina-episode-info-plus"||a.identifier!=="io.github.olivergiangvu.iinaepisodeinfoplus")process.exit(1)'
          mkdir -p dist
          V="$(node -p 'require("./Info.json").version')"
          OUT="dist/Episode-Info-Plus-$V.iinaplgz"
          zip -q -r "$OUT" Info.json main.js episode-plus-identity.js episode-plus-tvmaze.js episode-plus-http.js episode-plus-aios.js epplus-now-playing.js trusted-series-aliases.js sidebar.html overlay.html LICENSE
          unzip -tq "$OUT"
          node scripts/verify-plugin-package.js "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: episode-info-plus-ci-package
          path: dist/*.iinaplgz
          retention-days: 30

  publish_verified_stable:
    # One-time promotion after CI + Mac acceptance documented in this PR.
    # Future versions require a separately reviewed promotion PR; a routine
    # main push cannot silently become a new Stable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'olivergiangvu/iina-episode-info-plus'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: episode-info-plus-ci-package
          path: dist
      - name: Publish v1.3.5 Stable, retire non-compliant v1.3.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="$(node -p 'require("./Info.json").version')"
          if [ "$V" != "1.3.5" ]; then
            echo "No release: $V is not the explicitly accepted 1.3.5"
            exit 0
          fi
          ARTIFACT="dist/Episode-Info-Plus-1.3.5.iinaplgz"
          test -s "$ARTIFACT"
          node scripts/verify-plugin-package.js "$ARTIFACT"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.3.5" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs"               -f ref="refs/tags/v1.3.5" -f sha="$GITHUB_SHA"
          fi
          if ! gh release view v1.3.5 >/dev/null 2>&1; then
            gh release create v1.3.5 "$ARTIFACT"               --verify-tag               --title "Episode Info Plus v1.3.5 — Stable"               --notes-file docs/releases/v1.3.5.md               --latest
          else
            echo "Stable v1.3.5 already published; retaining existing release."
          fi
          # Keep the old tag and file for audit/rollback; remove Stable status.
          if gh release view v1.3.4 >/dev/null 2>&1; then
            gh release edit v1.3.4 --prerelease \
              --title "Episode Info Plus v1.3.4 — Retired (non-compliant)" \
              --notes-file docs/releases/v1.3.4-retired.md
          fi
          echo "Promoted v1.3.5 Stable; retired v1.3.4 to historical pre-release."
