name: Publish Episode Info Plus releases
on:
  push:
    branches: [main]
    paths:
      - Info.json
      - main.js
      - episode-plus-identity.js
      - episode-plus-tvmaze.js
      - episode-plus-http.js
      - episode-plus-aios.js
      - sidebar.html
      - overlay.html
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: episode-info-plus-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and manifest
        run: |
          node --check main.js
          node --check episode-plus-identity.js
          node --check episode-plus-tvmaze.js
          node --check episode-plus-http.js
          node --check episode-plus-aios.js
          node tests/episode-plus-identity.test.js
          node tests/upstream-134-integration.test.js
          node tests/upstream-135-integration.test.js
          node <<'NODE'
          const i = require('./Info.json');
          if (i.ghRepo !== 'olivergiangvu/iina-episode-info-plus' ||
              !Number.isInteger(i.ghVersion) || i.ghVersion < 1 ||
              !/^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(i.version))
            throw new Error('Invalid auto-update manifest');
          NODE
      - name: Build installable IINA package
        run: |
          mkdir -p dist
          V="$(node -p 'require("./Info.json").version')"
          zip -q -r "dist/Episode-Info-Plus-$V.iinaplgz" Info.json main.js episode-plus-identity.js episode-plus-tvmaze.js episode-plus-http.js episode-plus-aios.js sidebar.html overlay.html LICENSE
          unzip -t "dist/Episode-Info-Plus-$V.iinaplgz"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Publish versioned release (stable or prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping its immutable asset."
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            cat > /tmp/notes.md <<'NOTES'
          Episode Info Plus prerelease — independent fork of Zain Imam's IINA Episode Info.

          Playback-aware metadata matching with IMDb/filename/conflict checks, adaptive Light/Dark UI, and the original subtitle and skip-intro functionality. Review beta changes before production use.
          NOTES
            gh release create "$TAG" "dist/Episode-Info-Plus-$VERSION.iinaplgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Episode Info Plus $VERSION" --notes-file /tmp/notes.md \
              --prerelease --latest=false
          else
            cat > /tmp/notes.md <<'NOTES'
          Episode Info Plus v1.3.1 — Stable. Selective upstream v1.3.4 and v1.3.5 integration.

          Improvements:
          - Recover current settings when the IINA sidebar sends startup preferences before the plugin registers listeners.
          - Treat structured TMDB candidate HTTP 404 as a missing candidate, not a failed metadata service.
          - Automatically offer TMDB search results for uncertain identities without overwriting typed queries or adding entries to Recent Searches.
          - Following a user's explicit selection of a TV show, navigate to the season/episode inferred from the playback file. Never use the hint to identify the show automatically.
          - Verify "Show - Episode Title" only when TMDB has one exact episode of a sufficiently known show with a compatible runtime.
          - Resolve high absolute anime episode numbers only for Japanese animation when unambiguous across known season lengths.
          - Update Skip Intro's TheIntroDB query to the upstream v4 API endpoint.

          Compatibility and safety:
          - Existing TMDB primary, TVmaze fallback and HTTP bridge normalization remain intact.
          - Preserve Comet, MediaFusion/TorBox and AIOStreams HLS title matching, verified/provisional identities, diagnostics, subtitles, Light/Dark overlay and PiP.
          - No additional permissions, plugin identifier or storage migrations; ghVersion 12.
          - Glass theme, cast and Up Next are intentionally held for separate UI review due to the fork's customized adaptive appearance.
          - CI tests exercise upstream matching extensions and false-positive guards; newly merged UI flows have not yet been independently confirmed on a user's Mac.

          Previous Stable v0.1.2 remains available for rollback. Independent MIT-licensed fork of Zain Imam's Episode Info.

          NOTES
            gh release create "$TAG" "dist/Episode-Info-Plus-$VERSION.iinaplgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Episode Info Plus v$VERSION — Stable" --notes-file /tmp/notes.md \
              --latest
          fi
