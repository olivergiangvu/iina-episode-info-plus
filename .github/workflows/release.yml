name: Publish Episode Info Plus releases
on:
  push:
    branches: [main]
    paths:
      - Info.json
      - main.js
      - episode-plus-identity.js
      - episode-plus-tvmaze.js
      - episode-plus-http.js
      - sidebar.html
      - overlay.html
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: episode-info-plus-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and manifest
        run: |
          node --check main.js
          node --check episode-plus-identity.js
          node --check episode-plus-tvmaze.js
          node --check episode-plus-http.js
          node tests/episode-plus-identity.test.js
          node <<'NODE'
          const i = require('./Info.json');
          if (i.ghRepo !== 'olivergiangvu/iina-episode-info-plus' ||
              !Number.isInteger(i.ghVersion) || i.ghVersion < 1 ||
              !/^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(i.version))
            throw new Error('Invalid auto-update manifest');
          NODE
      - name: Build installable IINA package
        run: |
          mkdir -p dist
          V="$(node -p 'require("./Info.json").version')"
          zip -q -r "dist/Episode-Info-Plus-$V.iinaplgz" Info.json main.js episode-plus-identity.js episode-plus-tvmaze.js episode-plus-http.js sidebar.html overlay.html LICENSE
          unzip -t "dist/Episode-Info-Plus-$V.iinaplgz"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Publish versioned release (stable or prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping its immutable asset."
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            cat > /tmp/notes.md <<'NOTES'
          Episode Info Plus prerelease — independent fork of Zain Imam's IINA Episode Info.

          Playback-aware metadata matching with IMDb/filename/conflict checks, adaptive Light/Dark UI, and the original subtitle and skip-intro functionality. Review beta changes before production use.
          NOTES
            gh release create "$TAG" "dist/Episode-Info-Plus-$VERSION.iinaplgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Episode Info Plus $VERSION" --notes-file /tmp/notes.md \
              --prerelease --latest=false
          else
            cat > /tmp/notes.md <<'NOTES'
          Episode Info Plus v0.1.1 — Stable, promoted from v0.1.1-beta.3 after real playback verification on IINA/macOS.

          What's new:
          - Better MediaFusion/TorBox episode recognition from mpv filenames plus trustworthy S/E route agreement, including Fallout S02E07.
          - IINA HTTP bridge compatibility fix: explicitly encoded TMDB and TVmaze metadata API query strings.
          - TVmaze metadata fallback for TV episodes when TMDB cannot confirm; requires no extra API key. TVmaze fallback passed automated tests but not yet an independent on-device fallback test.
          - Optional in-plugin TMDB/TVmaze API diagnostics, which report only endpoint results.
          - Provisional state remains clearly labeled; metadata from TMDB/TVmaze is only marked verified after a successful exact match.

          Compatibility:
          - Existing IINA plugin identifier, local settings keys, Trakt+ integration boundaries and UI appearance preserved.
          - Two additional network hosts for TVmaze metadata and artwork: api.tvmaze.com and static.tvmaze.com.
          - v0.1.0 Stable remains available for rollback.
          - Maintained as an independent fork of Zain Imam's Episode Info (MIT License).

          NOTES
            gh release create "$TAG" "dist/Episode-Info-Plus-$VERSION.iinaplgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Episode Info Plus v$VERSION — Stable" --notes-file /tmp/notes.md \
              --latest
          fi
