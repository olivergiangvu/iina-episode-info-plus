name: Publish Episode Info Plus releases
on:
  push:
    branches: [main]
    paths:
      - Info.json
      - main.js
      - episode-plus-identity.js
      - episode-plus-tvmaze.js
      - episode-plus-http.js
      - episode-plus-aios.js
      - sidebar.html
      - overlay.html
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: episode-info-plus-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and manifest
        run: |
          node --check main.js
          node --check episode-plus-identity.js
          node --check episode-plus-tvmaze.js
          node --check episode-plus-http.js
          node --check episode-plus-aios.js
          node tests/episode-plus-identity.test.js
          node tests/upstream-134-integration.test.js
          node <<'NODE'
          const i = require('./Info.json');
          if (i.ghRepo !== 'olivergiangvu/iina-episode-info-plus' ||
              !Number.isInteger(i.ghVersion) || i.ghVersion < 1 ||
              !/^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(i.version))
            throw new Error('Invalid auto-update manifest');
          NODE
      - name: Build installable IINA package
        run: |
          mkdir -p dist
          V="$(node -p 'require("./Info.json").version')"
          zip -q -r "dist/Episode-Info-Plus-$V.iinaplgz" Info.json main.js episode-plus-identity.js episode-plus-tvmaze.js episode-plus-http.js episode-plus-aios.js sidebar.html overlay.html LICENSE
          unzip -t "dist/Episode-Info-Plus-$V.iinaplgz"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Publish versioned release (stable or prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping its immutable asset."
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            cat > /tmp/notes.md <<'NOTES'
          Episode Info Plus prerelease — independent fork of Zain Imam's IINA Episode Info.

          Playback-aware metadata matching with IMDb/filename/conflict checks, adaptive Light/Dark UI, and the original subtitle and skip-intro functionality. Review beta changes before production use.
          NOTES
            gh release create "$TAG" "dist/Episode-Info-Plus-$VERSION.iinaplgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Episode Info Plus $VERSION" --notes-file /tmp/notes.md \
              --prerelease --latest=false
          else
            cat > /tmp/notes.md <<'NOTES'
          Episode Info Plus v0.1.2 — Stable, promoted from v0.1.2-beta.1 after successful real-world IINA/macOS validation.

          What's new:
          - Recognize AIOStreams HLS title fragments such as index.m3u8#aios_title=OK! Let's Get Divorced · S01E10 · A Second Chance At Love.
          - Parse title, season, episode and optional episode title from URL fragments or IINA playback labels without trusting generic index.m3u8 as a show name.
          - Verify candidate metadata via the existing TMDB-first pipeline (TVmaze remains a fallback); distinguish provisional identity from externally verified metadata.
          - Fail closed on conflicting or duplicate AIOStreams annotations rather than matching an unrelated show.
          - Preserve the existing macOS Light/Dark/PiP interface, subtitle providers and skip-intro support.

          Validation:
          - User-confirmed AIOStreams S01E10 matched the correct series and episode title, poster, date, synopsis and TMDB verified label in IINA.
          - CI passes parser integration, negative/conflict regressions, JavaScript syntax, manifest and .iinaplgz archive validation.
          - No new plugin permissions, storage changes or Trakt+ changes.
          - Same plugin identifier and settings keys; ghVersion increased to 10 for automatic updates.

          Rollback: v0.1.1 and v0.1.0 remain available in GitHub Releases.
          This independent fork credits Zain Imam and retains the upstream MIT License.

          NOTES
            gh release create "$TAG" "dist/Episode-Info-Plus-$VERSION.iinaplgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Episode Info Plus v$VERSION — Stable" --notes-file /tmp/notes.md \
              --latest
          fi
