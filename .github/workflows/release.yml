name: Publish Episode Info Plus releases
on:
  push:
    branches: [main]
    paths:
      - Info.json
      - main.js
      - episode-plus-identity.js
      - sidebar.html
      - overlay.html
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: episode-info-plus-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and manifest
        run: |
          node --check main.js
          node --check episode-plus-identity.js
          node tests/episode-plus-identity.test.js
          node <<'NODE'
          const i = require('./Info.json');
          if (i.ghRepo !== 'olivergiangvu/iina-episode-info-plus' ||
              !Number.isInteger(i.ghVersion) || i.ghVersion < 1 ||
              !/^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(i.version))
            throw new Error('Invalid auto-update manifest');
          NODE
      - name: Build installable IINA package
        run: |
          mkdir -p dist
          V="$(node -p 'require("./Info.json").version')"
          zip -q -r "dist/Episode-Info-Plus-$V.iinaplgz" Info.json main.js episode-plus-identity.js sidebar.html overlay.html LICENSE
          unzip -t "dist/Episode-Info-Plus-$V.iinaplgz"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Publish versioned release (stable or prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping its immutable asset."
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            cat > /tmp/notes.md <<'NOTES'
          Episode Info Plus prerelease — independent fork of Zain Imam's IINA Episode Info.

          Playback-aware metadata matching with IMDb/filename/conflict checks, adaptive Light/Dark UI, and the original subtitle and skip-intro functionality. Review beta changes before production use.
          NOTES
            gh release create "$TAG" "dist/Episode-Info-Plus-$VERSION.iinaplgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Episode Info Plus $VERSION" --notes-file /tmp/notes.md \
              --prerelease --latest=false
          else
            cat > /tmp/notes.md <<'NOTES'
          Episode Info Plus v0.1.0 — Stable release, promoted from v0.1.0-beta.3 after user testing in IINA/macOS.

          - Smart automatic episode/movie matching from playback URLs, explicit IMDb/TMDB identifiers, release filenames and verified S/E context.
          - Two-stage TMDB enrichment with non-destructive timeout fallback and conflict safeguards.
          - High-contrast native macOS Light/Dark appearance for sidebar, overlays and Picture-in-Picture.
          - Original Episode Info subtitles, manual lookup, recent picks and skip-intro/credits preserved.
          - Existing Episode Info Plus plugin identifier and local settings keys preserved.

          No additional permissions or new services are needed. If using beta.2 or beta.3, update this plugin in IINA; if using the manually installed beta.1 without ghRepo, install the stable .iinaplgz once.

          This project is a fork of Zain Imam's Episode Info under the MIT License.
          NOTES
            gh release create "$TAG" "dist/Episode-Info-Plus-$VERSION.iinaplgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Episode Info Plus v$VERSION — Stable" --notes-file /tmp/notes.md \
              --latest
          fi
