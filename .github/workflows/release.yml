name: Publish Episode Info Plus releases
on:
  push:
    branches: [main]
    paths:
      - Info.json
      - main.js
      - episode-plus-identity.js
      - episode-plus-tvmaze.js
      - episode-plus-http.js
      - episode-plus-aios.js
      - sidebar.html
      - overlay.html
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: episode-info-plus-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and manifest
        run: |
          node --check main.js
          node --check episode-plus-identity.js
          node --check episode-plus-tvmaze.js
          node --check episode-plus-http.js
          node --check episode-plus-aios.js
          node tests/episode-plus-identity.test.js
          node tests/upstream-134-integration.test.js
          node tests/upstream-135-integration.test.js
          node tests/upstream-135-ui-integration.test.js
          node <<'NODE'
          const i = require('./Info.json');
          if (i.ghRepo !== 'olivergiangvu/iina-episode-info-plus' ||
              !Number.isInteger(i.ghVersion) || i.ghVersion < 1 ||
              !/^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(i.version))
            throw new Error('Invalid auto-update manifest');
          NODE
      - name: Build installable IINA package
        run: |
          mkdir -p dist
          V="$(node -p 'require("./Info.json").version')"
          zip -q -r "dist/Episode-Info-Plus-$V.iinaplgz" Info.json main.js episode-plus-identity.js episode-plus-tvmaze.js episode-plus-http.js episode-plus-aios.js sidebar.html overlay.html LICENSE
          unzip -t "dist/Episode-Info-Plus-$V.iinaplgz"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Publish versioned release (stable or prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping its immutable asset."
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            cat > /tmp/notes.md <<'NOTES'
          Episode Info Plus prerelease — independent fork of Zain Imam's IINA Episode Info.

          Playback-aware metadata matching with IMDb/filename/conflict checks, adaptive Light/Dark UI, and the original subtitle and skip-intro functionality. Review beta changes before production use.
          NOTES
            gh release create "$TAG" "dist/Episode-Info-Plus-$VERSION.iinaplgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Episode Info Plus $VERSION" --notes-file /tmp/notes.md \
              --prerelease --latest=false
          else
            cat > /tmp/notes.md <<'NOTES'
          Episode Info Plus v1.3.2 — Stable.

          Validated in IINA/macOS playback: Dr. Stone S04E22 automatically identified with TMDB-verified metadata; Glass overlay rendered Cast (four actors) and Up Next correctly. Promoted from v1.3.2-beta.1 with no behavioral code changes beyond version metadata.

          New UI (selected upstream v1.3.5 enhancements):
          - Optional Glass card: Frosted, Colorful or Clear, tuned for macOS Light/Dark and high contrast.
          - Adjustable card width 40–100% or Auto; Poster position Auto/Left/Right.
          - Optional Cast (up to four actors) and Up Next, both OFF by default. Compact remains single-line.
          - Extra metadata is fetched lazily via the existing TMDB connection and cached for the active episode.
          - Preferences persist and are re-sent after a delayed sidebar startup.

          Unchanged:
          - TMDB-first matching and TVmaze fallback; Comet, MediaFusion/TorBox and AIOStreams HLS title matching.
          - Verified/provisional identity rules, OpenSubtitles, SUBDL, Wyzie, Skip Intro, Light/Dark PiP behavior.
          - Plugin identifier, network permissions, stored preferences and separation from Trakt+.
          - ghVersion 14 for IINA update ordering.

          CI includes matching regression, startup/settings, stale-response guards, Glass/Light-Dark, optional extras, JS syntax and package validation.
          Previous Stable v1.3.1 remains published for rollback. Independent MIT-licensed fork of Zain Imam's Episode Info.

          NOTES
            gh release create "$TAG" "dist/Episode-Info-Plus-$VERSION.iinaplgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Episode Info Plus v$VERSION — Stable" --notes-file /tmp/notes.md \
              --latest
          fi
