<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root { --bg-opacity: 0.72; }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100vw; height:100vh;
    background:transparent;
    overflow:hidden;
    pointer-events:none;
    /* Match original font stack exactly */
    font-family:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;
    /* Antialiased, or text looks outlined on dark backgrounds */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* top default; JS overrides via showData / setVerticalPos */
  #wrap {
    position:fixed; top:50%; left:0; right:0;
    transform:translateY(-50%);
    pointer-events:none;
    display:none; /* hidden until showData arrives */
  }

  /* Full-width card */
  #card {
    width:100%; position:relative;
    background:rgba(10,10,10,var(--bg-opacity));
    padding:28px 5%;
    display:flex; align-items:center; gap:40px;
  }

  /* Text column */
  #text { flex:1; min-width:0; }

  .sn {
    font-size:13px; font-weight:600; letter-spacing:.18em;
    text-transform:uppercase; color:rgba(255,255,255,0.45); margin-bottom:10px;
  }
  .et {
    font-size:38px; font-weight:700; color:#fff;
    line-height:1.15; margin-bottom:12px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .mt {
    display:flex; align-items:center; gap:0;
    font-size:15px; color:rgba(255,255,255,0.55); margin-bottom:14px;
  }
  .mt span+span::before { content:' · '; color:rgba(255,255,255,0.3); margin:0 6px; }
  .rat { color:#f5c518; font-weight:600; }
  .ov {
    font-size:16px; color:rgba(255,255,255,0.65);
    line-height:1.6;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
  }

  /* Poster column */
  #poster {
    flex-shrink:0; width:14vw; max-width:200px; min-width:110px;
    align-self:center;
  }
  #poster img {
    width:100%; border-radius:8px; display:block;
    box-shadow:0 6px 28px rgba(0,0,0,0.7);
    opacity:0.92;
  }

  /* Compact theme: one line, no synopsis or poster */
  #wrap[data-theme="compact"] #card { padding:14px 4%; gap:18px; }
  #wrap[data-theme="compact"] #poster,
  #wrap[data-theme="compact"] .ov { display:none; }
  #wrap[data-theme="compact"] .sn {
    font-size:11px; letter-spacing:.14em; margin-bottom:0;
    display:inline; color:rgba(255,255,255,0.4);
  }
  #wrap[data-theme="compact"] .et {
    font-size:20px; margin-bottom:0; display:inline;
  }
  #wrap[data-theme="compact"] .sn::after {
    content:'·'; margin:0 8px; color:rgba(255,255,255,0.28);
  }
  #wrap[data-theme="compact"] .mt {
    font-size:13px; margin-bottom:0; margin-top:5px;
  }
  #wrap[data-theme="compact"] #text { display:block; }

  /* Poster Focus theme: a floating card led by the poster */
  #wrap[data-theme="poster"] #card {
    width:auto; max-width:72%; margin:0 auto;
    border-radius:16px; padding:22px 26px; gap:26px;
    flex-direction:row-reverse;
    box-shadow:0 18px 60px rgba(0,0,0,0.6);
  }
  #wrap[data-theme="poster"] #poster { width:16vw; max-width:180px; min-width:120px; }
  #wrap[data-theme="poster"] #poster img { box-shadow:0 10px 40px rgba(0,0,0,0.8); opacity:1; }
  #wrap[data-theme="poster"] .sn { margin-bottom:7px; }
  #wrap[data-theme="poster"] .et { font-size:30px; margin-bottom:9px; white-space:normal; }
  #wrap[data-theme="poster"] .mt { margin-bottom:11px; }
  #wrap[data-theme="poster"] .ov { -webkit-line-clamp:4; font-size:15px; line-height:1.55; }

  /* Glass theme: floating card filled with the episode's own poster, blurred */
  #wrap[data-theme="glass"] #card {
    width:auto; max-width:76%; margin:0 auto;
    border-radius:22px; padding:24px 28px; gap:28px;
    flex-direction:row-reverse;
    background:transparent; isolation:isolate;
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.32), 0 24px 70px rgba(0,0,0,0.42);
  }
  /* IINA's overlay can't blur the video behind it, so the frost comes from the poster; Clear has none */
  #art { display:none; }
  #wrap[data-theme="glass"] #art {
    display:block; position:absolute; inset:0; border-radius:inherit; overflow:hidden; z-index:-2;
  }
  #wrap[data-theme="glass"][data-glass="clear"] #art { display:none; }
  #wrap[data-theme="glass"] #art::before {
    content:""; position:absolute; inset:-60px;
    background:var(--art, none) center / cover no-repeat;
    -webkit-filter:blur(40px) saturate(150%) brightness(78%); filter:blur(40px) saturate(150%) brightness(78%);
  }
  /* Colorful: brighter artwork under a lighter tint */
  #wrap[data-theme="glass"][data-glass="colorful"] #art::before {
    -webkit-filter:blur(34px) saturate(220%) brightness(92%); filter:blur(34px) saturate(220%) brightness(92%);
  }
  #wrap[data-theme="glass"][data-glass="colorful"] #card::before { background:rgba(12,14,20,0.62); }
  /* Tint follows the Shade slider */
  #wrap[data-theme="glass"] #card::before {
    content:""; position:absolute; inset:0; border-radius:inherit; z-index:-1;
    background:rgba(12,14,20,0.84); opacity:var(--bg-opacity);
  }
  #wrap[data-theme="glass"] #card::after {
    content:""; position:absolute; inset:0; border-radius:inherit; z-index:-1;
    background:linear-gradient(135deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 38%, rgba(255,255,255,0) 62%);
  }
  #wrap[data-theme="glass"] #poster { width:15vw; max-width:170px; min-width:110px; }
  #wrap[data-theme="glass"] #poster img {
    border-radius:12px; opacity:1;
    box-shadow:0 10px 34px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.16);
  }
  #wrap[data-theme="glass"] #text { text-shadow:0 1px 3px rgba(0,0,0,0.6); }
  #wrap[data-theme="glass"] .sn { color:rgba(255,255,255,0.62); margin-bottom:8px; }
  #wrap[data-theme="glass"] .et { font-size:30px; white-space:normal; margin-bottom:8px; }
  #wrap[data-theme="glass"] .mt { color:rgba(255,255,255,0.74); margin-bottom:10px; }
  #wrap[data-theme="glass"] .ov { color:rgba(255,255,255,.94); -webkit-line-clamp:3; font-size:15.5px; line-height:1.55; font-weight:500; }
  /* Over a light poster the grey labels faded, so near-white text with a firmer shadow */
  #wrap[data-theme="glass"]:not([data-glass="clear"]) #text { text-shadow:0 1px 3px rgba(0,0,0,0.75), 0 0 10px rgba(0,0,0,0.3); }
  #wrap[data-theme="glass"]:not([data-glass="clear"]) .sn,
  #wrap[data-theme="glass"]:not([data-glass="clear"]) .mt,
  #wrap[data-theme="glass"]:not([data-glass="clear"]) .person i,
  #wrap[data-theme="glass"]:not([data-glass="clear"]) .next .lbl { color:rgba(255,255,255,0.88); }
  #wrap[data-theme="glass"]:not([data-glass="clear"]) .ov,
  #wrap[data-theme="glass"]:not([data-glass="clear"]) .next { color:rgba(255,255,255,0.96); }

  /* Cast and Up next; never on Compact */
  #extra { display:none; margin-top:16px; }
  #wrap[data-extra] #extra { display:block; }
  #wrap[data-theme="compact"] #extra { display:none; }
  /* One row of as many as fit; the rest wrap out of sight rather than squeeze */
  .cast {
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    grid-auto-rows:36px; row-gap:40px; column-gap:14px;
    max-height:38px; padding:1px; overflow:hidden;
  }
  .person { display:flex; align-items:center; gap:9px; min-width:0; }
  .person img {
    width:34px; height:34px; border-radius:50%; object-fit:cover; flex-shrink:0;
    box-shadow:0 0 0 1px rgba(255,255,255,0.35);
  }
  .person span { min-width:0; }
  .person b, .person i {
    display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .person b { font-size:13px; font-weight:650; color:#fff; }
  .person i { font-style:normal; font-size:11.5px; color:rgba(255,255,255,0.62); }
  .next {
    display:inline-flex; align-items:center; gap:9px; margin-top:14px;
    padding:6px 13px; border-radius:999px;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.16);
    font-size:12.5px; color:rgba(255,255,255,0.88);
  }
  .next .lbl { font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,0.56); }

  /* Card width from the sidebar; unset keeps the theme's own */
  #wrap[data-width] #card { width:var(--card-width); max-width:none; margin-left:auto; margin-right:auto; }
  #wrap[data-width][data-theme="classic"] #card,
  #wrap[data-width][data-theme="compact"] #card { border-radius:14px; }
  #wrap[data-width][data-full] #card { border-radius:0; }
  #wrap[data-width][data-full][data-theme="glass"] #card { border-left:0; border-right:0; }

  /* Poster side from the sidebar; unset keeps the theme's own */
  #wrap[data-poster="left"]:not([data-theme="compact"]) #card { flex-direction:row-reverse; }
  #wrap[data-poster="right"]:not([data-theme="compact"]) #card { flex-direction:row; }

  /* Skip pill, independent of the info card */
  #skip-wrap {
    position:fixed; right:4vw; bottom:12vh;
    display:none;              /* shown by showSkip */
    pointer-events:none;       /* only the button itself is clickable */
  }
  #skip-btn {
    pointer-events:auto;
    display:flex; align-items:center; gap:9px;
    background:rgba(18,18,20,0.86);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:10px;
    padding:12px 20px;
    color:#fff; font-size:15px; font-weight:600;
    font-family:inherit; cursor:pointer;
    box-shadow:0 6px 26px rgba(0,0,0,0.55);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:background .15s, border-color .15s, transform .15s;
    animation:skipIn .22s ease-out;
  }
  #skip-btn:hover {
    background:rgba(32,32,36,0.94);
    border-color:rgba(255,255,255,0.4);
    transform:translateY(-1px);
  }
  #skip-btn .ic { font-size:13px; opacity:.85; }
  /* Keep hit tests on the button, not a span inside it */
  #skip-btn > * { pointer-events:none; }
  @keyframes skipIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  /* Episode Info Plus: text and card ALWAYS change together to preserve contrast.
     Light mode adapts floating/PiP overlays while keeping the background translucent. */
  :root { color-scheme: light dark; }
  #card { backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  @media (prefers-color-scheme: light) {
    #card {
      background:rgba(250,251,253,var(--bg-opacity));
      border-top:1px solid rgba(21,35,53,.11);
      border-bottom:1px solid rgba(21,35,53,.11);
    }
    .sn, #wrap[data-theme="compact"] .sn { color:#4c5c70; }
    .et { color:#142132; }
    .mt { color:#45566b; }
    .mt span+span::before, #wrap[data-theme="compact"] .sn::after { color:#8894a3; }
    .rat { color:#8b5a00; }
    .ov { color:#39495d; }
    #wrap[data-theme="poster"] #card { box-shadow:0 18px 60px rgba(21,35,53,.24); }
    /* The skip control retains its dark own background and white text. */
    #skip-btn { color:#fff; }
  }
  @media (prefers-contrast: more) {
    #card { background:Canvas !important; color:CanvasText !important; }
    .sn,.et,.mt,.ov { color:CanvasText !important; }
  }

  /* Episode Info Plus Light/Dark compatibility with opt-in Glass. */
  @media (prefers-color-scheme:light) {
    #wrap[data-theme="glass"] #card {
      background:transparent;border-color:rgba(255,255,255,.22);
    }
    /* Use a dark fallback behind the poster, not a dark layer covering it. */
    /* Frosted and Colorful retain the same dark-on-poster glass recipe as
       Dark Mode; the palette flips only for the explicitly Clear variant. */
    #wrap[data-theme="glass"] #art {background:rgba(12,14,20,.90);}
    #wrap[data-theme="glass"] .et,#wrap[data-theme="glass"] .person b {color:#fff;}
    #wrap[data-theme="glass"] .sn {color:rgba(255,255,255,.84);}
    #wrap[data-theme="glass"] .mt,#wrap[data-theme="glass"] .ov,
    #wrap[data-theme="glass"] .person i,#wrap[data-theme="glass"] .next,
    #wrap[data-theme="glass"] .next .lbl {color:rgba(255,255,255,.90);}
    #wrap[data-theme="glass"] .rat {color:#f5c518;}
    /* In Light Mode a translucent WHITE Clear card produced dark text over
       an unpredictable grey/video luminance. Video pixels cannot be sampled
       by the separate IINA overlay WebView, so invert the MATERIAL, not the
       text. A neutral dark smoked glass works in both macOS appearances.
       At the minimum Shade threshold .68, the .84-black tint produces
       >=4.5:1 white text even above an entirely white frame. */
    #wrap[data-theme="glass"][data-glass="clear"] #card {
      background:transparent;
      border-color:rgba(255,255,255,.24);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.25),
        0 20px 54px rgba(0,0,0,.34);
    }
    #wrap[data-theme="glass"][data-glass="clear"] #card::before {
      display:block;
      background:rgba(10,16,24,.84);
      opacity:.72; /* for older WebKit without clamp() */
      opacity:clamp(.68,var(--bg-opacity),1);
    }
    #wrap[data-theme="glass"][data-glass="clear"] #card::after {
      display:block;
      background:linear-gradient(130deg,rgba(255,255,255,.10),transparent 58%);
    }
    #wrap[data-theme="glass"][data-glass="clear"] #text {
      text-shadow:0 1px 2px rgba(0,0,0,.44);
    }
    #wrap[data-theme="glass"][data-glass="clear"] .et,
    #wrap[data-theme="glass"][data-glass="clear"] .person b {color:#f9fbff;}
    #wrap[data-theme="glass"][data-glass="clear"] .sn,
    #wrap[data-theme="glass"][data-glass="clear"] .mt,
    #wrap[data-theme="glass"][data-glass="clear"] .ov,
    #wrap[data-theme="glass"][data-glass="clear"] .person i,
    #wrap[data-theme="glass"][data-glass="clear"] .next,
    #wrap[data-theme="glass"][data-glass="clear"] .next .lbl {
      color:rgba(255,255,255,.94);
    }
    #wrap[data-theme="glass"][data-glass="clear"] .mt span+span::before {
      color:rgba(255,255,255,.72);
    }
    #wrap[data-theme="glass"][data-glass="clear"] .rat {color:#ffd25b;}
    #wrap[data-theme="glass"][data-glass="clear"] .next {
      background:rgba(255,255,255,.12);
      border-color:rgba(255,255,255,.24);
    }
    #wrap[data-theme="glass"][data-glass="clear"] .person img {
      box-shadow:0 0 0 1px rgba(255,255,255,.38);
    }
    #wrap:not([data-theme="glass"]) .person b {color:#142132;}
    #wrap:not([data-theme="glass"]) .person i {color:#45576b;}
    #wrap:not([data-theme="glass"]) .next {color:#344559;background:rgba(21,35,53,.08);border-color:rgba(21,35,53,.15);}
    #wrap:not([data-theme="glass"]) .next .lbl {color:#53667e;}
  }
  @media(prefers-contrast:more) {
    #wrap[data-theme="glass"] #card {background:Canvas !important;}
    #wrap[data-theme="glass"] #card::before,
    #wrap[data-theme="glass"] #card::after {display:none !important;}
    #wrap[data-theme="glass"] #text {text-shadow:none !important;}
    #wrap[data-theme="glass"] .sn,#wrap[data-theme="glass"] .et,
    #wrap[data-theme="glass"] .mt,#wrap[data-theme="glass"] .ov,
    #wrap[data-theme="glass"] .person b,#wrap[data-theme="glass"] .person i,
    #wrap[data-theme="glass"] .next {color:CanvasText !important;}
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="card">
    <div id="art" aria-hidden="true"></div>
    <div id="text">
      <div class="sn" id="show-name"></div>
      <div class="et" id="ep-title"></div>
      <div class="mt" id="meta-row"></div>
      <div class="ov"  id="overview"></div>
      <div id="extra"><div id="cast" class="cast"></div><div id="next" class="next"></div></div>
    </div>

    <div id="poster"></div>
  </div>
</div>

<div id="skip-wrap">
  <!-- IINA only sends mouse events to elements with data-clickable -->
  <button id="skip-btn" data-clickable>
    <span class="ic">&#9654;&#9654;</span><span id="skip-label">Skip Intro</span>
  </button>
</div>

<script>
// Escape text going into innerHTML
function esc(s) {
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Vertical position: 0 top, 50 center, 100 bottom; snaps near the edges
function applyVerticalPos(v) {
  var wrap = document.getElementById("wrap");
  if (v <= 5) {
    wrap.style.top = "0";
    wrap.style.bottom = "auto";
    wrap.style.transform = "none";
  } else if (v >= 95) {
    wrap.style.top = "auto";
    wrap.style.bottom = "0";
    wrap.style.transform = "none";
  } else {
    wrap.style.bottom = "auto";
    wrap.style.top = v + "%";
    wrap.style.transform = "translateY(-50%)";
  }
}

// Episode data from main.js
iina.onMessage("showData", function(d) {
  // Update background shade first
  if (typeof d.bgOpacity === "number") {
    document.documentElement.style.setProperty("--bg-opacity", d.bgOpacity);
  }

  // Apply vertical position
  if (typeof d.verticalPos === "number") {
    applyVerticalPos(d.verticalPos);
  }

  // Theme first, so it never flashes Classic
  if (d.theme) applyTheme(d.theme);
  applyWidth(d.width);
  applyPosterSide(d.poster);
  applyGlassStyle(d.glass);
  // CSS-art background accepts only explicitly allowlisted image hosts.
  var art=String(d.posterUrl||"");
  var safeArt=/^https:\/\/(?:image\.tmdb\.org|static\.tvmaze\.com)\/[A-Za-z0-9_./%-]+$/.test(art);
  document.getElementById("card").style.setProperty("--art",safeArt?'url("'+art+'")':"none");

  document.getElementById("show-name").textContent = d.showTitle || "";

  document.getElementById("ep-title").textContent = d.epTitle || "";

  // Meta row: code · airDate · ★ rating
  var parts = [];
  if (d.code)    parts.push("<span>" + esc(d.code) + "</span>");
  if (d.airDate) parts.push("<span>" + esc(d.airDate) + "</span>");
  if (d.rating)  parts.push('<span class="rat">&#9733; ' + esc(d.rating) + "</span>");
  document.getElementById("meta-row").innerHTML = parts.join("");

  document.getElementById("overview").textContent = d.overview || "";

  var posterEl = document.getElementById("poster");
  if (d.posterUrl) {
    posterEl.innerHTML = "<img src='" + esc(d.posterUrl) + "' />";
  } else {
    posterEl.innerHTML = "";
  }

  // Render optional cast and next episode without letting strings introduce
  // markup, unsupported URLs or attributes.
  var people=Array.isArray(d.cast)?d.cast.slice(0,4):[];
  document.getElementById("cast").innerHTML=people.map(function(c){
    var photo=String(c.photo||"");
    var safe=/^https:\/\/image\.tmdb\.org\/t\/p\/[a-z0-9]+\/[A-Za-z0-9_./%-]+$/i.test(photo);
    var role=String(c.role||"").replace(/\s*\((voice|uncredited|archive footage)\)/gi,"").split(" / ")[0];
    return "<div class='person'>"+(safe?"<img src='"+photo+"' alt='' />":"")+
      "<span><b>"+esc(c.name)+"</b><i>"+esc(role)+"</i></span></div>";
  }).join("");
  var next=d.next,el=document.getElementById("next");
  el.innerHTML=next?"<span class='lbl'>Up next</span> "+
    esc(next.code)+" · "+esc(next.title)+(next.date?" · "+esc(next.date):""):"";
  el.style.display=next?"":"none";
  var wrap=document.getElementById("wrap");
  if(people.length||next)wrap.setAttribute("data-extra","");
  else wrap.removeAttribute("data-extra");
  wrap.style.display="block";
});

// Live opacity from the sidebar
iina.onMessage("setBgOpacity", function(d) {
  if (typeof d.value === "number") {
    document.documentElement.style.setProperty("--bg-opacity", d.value);
  }
});

// Live vertical position
iina.onMessage("setVerticalPos", function(d) {
  if (typeof d.value === "number") {
    applyVerticalPos(d.value);
  }
});

// Theme: classic | compact | poster
function applyTheme(name) {
  var ok = { classic: 1, compact: 1, poster: 1, glass: 1 };
  document.getElementById("wrap").setAttribute("data-theme", ok[name] ? name : "classic");
}

iina.onMessage("setTheme", function(d) {
  applyTheme(d && d.value);
});

// Width 40-100 (% of the window), or nothing for the theme's own
function applyWidth(v) {
  var wrap = document.getElementById("wrap");
  if (typeof v === "number" && v >= 40 && v <= 100) {
    wrap.setAttribute("data-width", "");
    wrap.style.setProperty("--card-width", v + "%");
    if (v >= 100) wrap.setAttribute("data-full", ""); else wrap.removeAttribute("data-full");
  } else {
    wrap.removeAttribute("data-width");
    wrap.removeAttribute("data-full");
  }
}

iina.onMessage("setWidth", function(d) { applyWidth(d && d.value); });

function applyPosterSide(v) {
  var wrap = document.getElementById("wrap");
  if (v === "left" || v === "right") wrap.setAttribute("data-poster", v); else wrap.removeAttribute("data-poster");
}
iina.onMessage("setPosterSide", function(d) { applyPosterSide(d && d.value); });

// Frosted unless the sidebar says Clear or Colorful
function applyGlassStyle(v) {
  var wrap = document.getElementById("wrap");
  if (v === "clear" || v === "colorful") wrap.setAttribute("data-glass", v); else wrap.removeAttribute("data-glass");
}
iina.onMessage("setGlassStyle", function(d) { applyGlassStyle(d && d.value); });

// Hide only the info card; the skip pill is separate
iina.onMessage("hideCard", function() {
  document.getElementById("wrap").style.display = "none";
});

// Skip pill
iina.onMessage("showSkip", function(d) {
  document.getElementById("skip-label").textContent = (d && d.label) || "Skip Intro";
  document.getElementById("skip-wrap").style.display = "block";
  // Replay the entry animation on each appearance
  var b = document.getElementById("skip-btn");
  b.style.animation = "none";
  void b.offsetWidth;
  b.style.animation = "";
});

iina.onMessage("hideSkip", function() {
  document.getElementById("skip-wrap").style.display = "none";
});

// A bound listener, since inline onclick can be blocked by the content policy
(function () {
  var btn = document.getElementById("skip-btn");
  if (!btn) return;
  var sent = false;
  function fire(ev) {
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
    if (sent) return;              // click and mouseup must not both send
    sent = true;
    setTimeout(function () { sent = false; }, 800);
    var lab = document.getElementById("skip-label");
    if (lab) lab.textContent = "Skipping\u2026";
    try { iina.postMessage("skipSegment", {}); } catch (e) {
      if (lab) lab.textContent = "postMessage failed";
    }
  }
  btn.addEventListener("click", fire);
  // Some hit tests only deliver the low-level events
  btn.addEventListener("mousedown", function (ev) { ev.stopPropagation(); });
  btn.addEventListener("mouseup", fire);
})();
</script>
</body>
